<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#050914">

    <meta name="description"
          content="X Calculator — A premium aesthetic calculator.">

    <link rel="manifest" href="manifest.json">

    <link rel="icon" type="image/svg+xml" href="icon.svg">

    <title>X CALCULATOR</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div class="calculator">

        <div class="top">

            <div class="logo">

                <div class="x-logo">X</div>

                <div>
                    <div class="title">X CALCULATOR</div>
                    <div class="subtitle">
                        SMART • FAST • SIMPLE
                    </div>
                </div>

            </div>

            <div class="power">
                <span></span>
            </div>

        </div>


        <div class="display">

            <div class="history" id="history"></div>

            <div class="expression" id="expression">
                0
            </div>

        </div>


        <div class="buttons">

            <button class="btn special" data-action="clear">
                AC
            </button>

            <button class="btn special" data-action="delete">
                ⌫
            </button>

            <button class="btn special" data-action="percent">
                %
            </button>

            <button class="btn operator" data-value="÷">
                ÷
            </button>


            <button class="btn number" data-value="7">7</button>
            <button class="btn number" data-value="8">8</button>
            <button class="btn number" data-value="9">9</button>

            <button class="btn operator" data-value="×">
                ×
            </button>


            <button class="btn number" data-value="4">4</button>
            <button class="btn number" data-value="5">5</button>
            <button class="btn number" data-value="6">6</button>

            <button class="btn operator" data-value="−">
                −
            </button>


            <button class="btn number" data-value="1">1</button>
            <button class="btn number" data-value="2">2</button>
            <button class="btn number" data-value="3">3</button>

            <button class="btn operator" data-value="+">
                +
            </button>


            <button class="btn number zero" data-value="0">
                0
            </button>

            <button class="btn number" data-value=".">
                .
            </button>

            <button class="btn equals" data-action="calculate">
                =
            </button>

        </div>


        <div class="footer">
            <span class="footer-x">X</span>
            <span>PRECISION CALCULATOR</span>
        </div>

    </div>

</div>


<script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
            .catch(error => {
                console.log("Service Worker Error:", error);
            });
    });
}
</script>

</body>
</html>
