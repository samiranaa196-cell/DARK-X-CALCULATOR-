<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512">

    <defs>

        <linearGradient
            id="bg"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop offset="0%" stop-color="#020711"/>
            <stop offset="55%" stop-color="#07152d"/>
            <stop offset="100%" stop-color="#01040a"/>

        </linearGradient>


        <linearGradient
            id="blue"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop offset="0%" stop-color="#7ee8ff"/>
            <stop offset="35%" stop-color="#168cff"/>
            <stop offset="100%" stop-color="#0645a0"/>

        </linearGradient>


        <filter id="glow">

            <feGaussianBlur
                stdDeviation="7"
                result="blur"/>

            <feMerge>

                <feMergeNode in="blur"/>

                <feMergeNode in="SourceGraphic"/>

            </feMerge>

        </filter>

    </defs>


    <!-- Background -->

    <rect
        x="20"
        y="20"
        width="472"
        height="472"
        rx="105"
        fill="url(#bg)"
        stroke="#168cff"
        stroke-width="7"/>


    <!-- X -->

    <path
        d="M145 115
           L220 115
           L370 360
           L294 360
           Z"

        fill="url(#blue)"
        filter="url(#glow)"/>


    <path
        d="M367 115
           L442 115
           L218 397
           L143 397
           Z"

        fill="url(#blue)"
        filter="url(#glow)"/>


    <!-- Orbital Ring -->

    <ellipse
        cx="256"
        cy="256"
        rx="185"
        ry="65"
        fill="none"
        stroke="#18a8ff"
        stroke-width="9"
        transform="rotate(-17 256 256)"
        filter="url(#glow)"/>


    <!-- Calculator -->

    <rect
        x="185"
        y="365"
        width="142"
        height="105"
        rx="25"
        fill="#030a16"
        stroke="#168cff"
        stroke-width="6"/>


    <!-- Calculator Buttons -->

    <g
        fill="#071a33"
        stroke="#168cff"
        stroke-width="4">

        <rect x="201" y="380"
              width="42" height="30"
              rx="8"/>

        <rect x="269" y="380"
              width="42" height="30"
              rx="8"/>

        <rect x="201" y="425"
              width="42" height="30"
              rx="8"/>

        <rect x="269" y="425"
              width="42" height="30"
              rx="8"/>

    </g>


    <!-- Symbols -->

    <g
        fill="#8ce8ff"
        font-family="Arial"
        font-size="24"
        font-weight="bold"
        text-anchor="middle">

        <text x="222" y="403">+</text>
        <text x="290" y="403">−</text>
        <text x="222" y="448">×</text>
        <text x="290" y="448">÷</text>

    </g>

</svg>
